# Master run_mode
run_mode:
  fem: FALSE # Boolean for whether to run the fem
  model: TRUE # Boolean for whether to run the model

# Network config
net_config:

  training:
    n_epochs: 5

  data:
    snapshot_path: "tests/containerize_pipeline/fem/snapshot.npz"

  export:
    mode: "online"
    wandb_entity: "Hypersonics"
    wandb_project: "Tests"
    wandb_name: "docker_model"
    local_log_path: "tests/containerize_pipeline/model/model_log.txt"
    model_save_path: "tests/containerize_pipeline/model/model.pt"
    plot_comp_path: "tests/containerize_pipeline/model/model_comp_plot.png"
